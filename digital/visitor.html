<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>数字人问答</title><link rel="stylesheet" href="prototype.css?v=2"><link rel="stylesheet" href="visitor.css"><link rel="stylesheet" href="studio.css?v=2"></head><body><main class="visitor-shell" id="entry"></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem('chengyu_demo_v1_db')||'{}')}catch{db={}}const params=new URLSearchParams(location.search),token=params.get('token'),previewId=params.get('preview');let app=previewId?(db.apps||[]).find(a=>String(a.id)===previewId):(db.apps||[]).find(a=>a.status==='已发布'&&a.url?.split('token=')[1]===token);const entry=document.querySelector('#entry');let sound=true;
function resource(id,type){return (db.resources||[]).find(r=>r.id===id&&r.type===type)}
function draw(){const avatar=resource(app?.avatar,'形象'),bg=resource(app?.bg,'背景'),terminal=app?.terminal||'PC';entry.innerHTML=`<section class="visitor-stage ${terminal==='H5'?'visitor-h5':''} ${terminal==='大屏'?'visitor-large':''}" id="stage"><div class="visitor-title">${esc(app?.title||'数字人问答')}</div><button class="visitor-sound" id="sound" aria-label="静音" onclick="toggleSound()">♪</button><img class="visitor-avatar" src="${esc(avatar?.img||'avatars/avatar-01.png')}" alt="数字人形象"><div class="visitor-suggestions">${(app?.questions||[]).map((q,i)=>`<button onclick="useQuestion(${i})">${esc(q)}</button>`).join('')}</div><div class="visitor-message" id="message">${esc(app?.intro||'您好，请问有什么可以帮到您？')}</div><div class="visitor-input-area"><div id="textForm" class="visitor-text-form" hidden><label class="sr-only" for="question">输入问题</label><input id="question" type="text" placeholder="输入问题"><button onclick="send()">发送</button></div><div class="visitor-controls"><button class="visitor-keyboard" onclick="toggleText()" aria-label="切换文字输入">⌨</button><button class="visitor-speak" onclick="recordAudio()">开始录音</button></div><div class="visitor-actions"><button onclick="draw()">新会话</button><button onclick="stopSpeaking()">停止播报</button></div></div></section><p class="visitor-note">作品集演示 · 问答为本地示例，不录音、不调用 AI 服务。<a href="index.html">返回工作空间</a></p>`;const stage=document.getElementById('stage');if(bg?.img)stage.style.backgroundImage='url('+JSON.stringify(bg.img)+')'}
function toggleText(){let form=document.getElementById('textForm');form.hidden=!form.hidden;if(!form.hidden)document.getElementById('question').focus()}
function send(){let field=document.getElementById('question'),q=field.value.trim();if(!q)return;document.getElementById('message').textContent='【演示回答】'+(q.includes('知识')?'在工作空间中打开知识库配置，可以维护内容并测试后更新线上版本。':q.includes('内容')?'打开数字人播报，选择形象、音色和背景，填写文案后保存或模拟生成。':'你好，这里是澄屿数字的虚构服务演示。你可以体验内容制作、问答配置与团队管理。');field.value=''}
function useQuestion(i){const q=(app?.questions||[])[i];if(!q)return;const form=document.getElementById('textForm');form.hidden=false;const field=document.getElementById('question');field.value=q;field.focus()}
function recordAudio(){document.getElementById('message').textContent='暂无法录音，请使用文字输入。'}function stopSpeaking(){document.getElementById('message').textContent='已停止播报。'}function toggleSound(){sound=!sound;const button=document.getElementById('sound');button.textContent=sound?'♪':'×';button.setAttribute('aria-label',sound?'静音':'开启声音')}
if(!app){entry.innerHTML='<div class="visitor-access"><h2>链接不可用</h2><p>应用已下线或链接已失效。</p></div>'}else if(app.code&&!previewId){entry.innerHTML='<div class="visitor-access"><h2>请输入访问码</h2><label for="code">访问码</label><input id="code" type="text"><button class="btn primary" onclick="check()">进入</button></div>'}else draw();function check(){if(document.getElementById('code').value===app.code)draw();else alert('访问码错误')}
</script></body></html>
