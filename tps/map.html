<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Politecnico di Torino · Example map</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font:12px Arial,sans-serif;background:#e9edf0}#map{width:100%;height:100%;position:relative;overflow:hidden;touch-action:none;cursor:grab}#map:active{cursor:grabbing}svg{position:absolute;inset:0;pointer-events:none}#pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;border:0;background:transparent;padding:0;transform:translate(-50%,-75%);pointer-events:auto;cursor:pointer;touch-action:none}.pin img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 2px #26334b44)}.pin .fallback{display:block;border:3px solid white;background:#092c3c;color:white;font-size:24px;font-weight:bold;width:35px;height:39px;border-radius:20px 20px 20px 2px;box-shadow:0 2px 5px #0004}.pin.vertex{width:20px;height:20px;border:3px solid white;border-radius:50%;background:#4c67c4;transform:translate(-50%,-50%);box-shadow:0 1px 3px #0005}.pin:focus-visible,button:focus-visible{outline:3px solid #3889dc;outline-offset:3px}.tools{position:absolute;right:10px;top:100px;display:grid;gap:1px;background:white;box-shadow:0 2px 8px #0003;border-radius:8px;overflow:hidden}.tools button{width:34px;height:34px;color:#465568;font-size:23px;background:#fff;border:0;cursor:pointer}.tools button:last-child{font-size:20px;border-top:1px solid #ddd}.notice{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;background:#fffffff0;font-size:10px;color:#526078;pointer-events:none}#polygons{pointer-events:none}#polygons polygon{pointer-events:auto;cursor:pointer}#label{position:absolute;top:8px;left:8px;background:#ffffffdf;padding:6px 9px;border-radius:7px;color:#5f6a7b;font-size:10px;pointer-events:none;max-width:70%}
