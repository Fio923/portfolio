<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPS 原版界面 · 在线体验</title><style>

</style></head><body><header><b>TPS</b><a href="../project.html?id=gtt">返回作品集</a></header><nav class="toolbar" aria-label="选择角色"><button data-role="user" aria-pressed="true">停车用户</button><button data-role="officer" aria-pressed="false">巡查员</button><button data-role="manager" aria-pressed="false">管理员</button><button class="reset" id="reset">重置演示数据</button></nav><p class="note">原 Flutter 界面 · 本地示例地图与模拟接口　｜　演示登录：demo@tps.example / Demo123!<br><span id="tip">用户端可用车辆 DEMO004；巡查员可查询 DEMO001（有效）、DEMO002（过期）、DEMO003（初始宽限期）。</span></p><main class="stage"><div class="frame"><iframe id="app-frame" src="user/" title="TPS 原始用户端界面" allow="clipboard-write"></iframe></div></main><footer>付款、车牌识别与执法通知均为演示，不产生实际交易。数据修改仅保存在本浏览器。</footer><script>
