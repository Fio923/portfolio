<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TPS · Ticketless Parking System</title>
  <meta name="description" content="TPS 智能停车交互演示：停车用户、巡查员和管理员三端联动。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="preview-bar"><a class="brand" href="../project.html?id=gtt"><b>TPS</b><span>Ticketless Parking System</span></a><a href="../project.html?id=gtt">返回作品集</a></header>
  <main class="stage">
    <section class="demo-controls" aria-label="演示控制">
      <div><h1>一次停车，三个视角。</h1><p>切换角色，体验找位、核验与运营管理。仅为演示，不会产生实际付款或罚单。</p></div>
      <div class="role-tabs" role="tablist" aria-label="体验角色">
        <button role="tab" id="role-user" data-role="user" aria-selected="true">停车用户 <small>Driver</small></button>
        <button role="tab" id="role-officer" data-role="officer" aria-selected="false">巡查员 <small>Officer</small></button>
        <button role="tab" id="role-manager" data-role="manager" aria-selected="false">管理员 <small>Manager</small></button>
      </div>
    </section>
    <section class="workspace">
      <aside class="guide" id="guide" aria-label="体验提示"></aside>
      <div class="device" id="device"><div class="statusbar"><span>9:41</span><span aria-hidden="true">▮▮▮　▰</span></div><section id="app" aria-label="TPS application"></section></div>
    </section>
    <footer class="demo-footer"><span>停车场与车位源自项目备份；演示车辆、会话和账号为虚构。更改仅保存在本浏览器。</span><div><button id="advance" class="plain">推进 15 分钟</button><button id="reset" class="plain">重置演示</button></div><span id="clock-label"></span></footer>
  </main>
  <dialog id="dialog" aria-label="TPS dialog"><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
